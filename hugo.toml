baseURL = 'https://dlcnatsuki.top/'
locale = 'zh-CN'
defaultContentLanguage = 'zh'
title = 'DLCNatsuki的PRTS终端'
theme = 'PaperMod'
enableRobotsTXT = true

[pagination]
  pagerSize = 5

[params]
  env = 'production'
  description = '记录一些东西'
  author = 'DLCNatsuki'
  defaultTheme = 'auto'
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = true
  UseHugoToc = true

[params.homeInfoParams]
  Title = '你好，我是DLCNatsuki(夏木)'
  Content = '''
你好呀，首先感谢你可以来到这里看一看。我是DLCNatsuki，译名夏木，河北石家庄人，现为南京某高校电气工程及其自动化专业大一本科生，虽然为电气专业，但是励志自学计算机编程与
程序开发等，目前仍在学习阶段，在学C++，python，VScode与matlab，想搞一个自己的网页和程序，期待我的后续学习。二次元中度依赖，各大二游均有涉猎，目前主玩明日方舟（大炎不
是区），终末地和BA（不要电我喵~）。艾拉单推人（可塑性记忆的第二季呢）。周末喜欢喜欢在市里闲逛觅食（概率刷新骑行形态）。
后续会在此站发布一些计算机自学的心得以及一些自己搞的小玩意儿。


仍在完善中………

'''

