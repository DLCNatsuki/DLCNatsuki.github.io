<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>贪吃蛇</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --line: #232833;
    --text: #e8eaed;
    --dim: #8b93a1;
    --accent: #4ade80;
    --danger: #ef4444;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
    display: flex; align-items: center; justify-content: center;
    min-height: 100%;
  }
  .wrap { width: min(92vw, 440px); padding: 16px 0 24px; }
  .hud {
    display: flex; align-items: center; gap: 12px;
    font-size: 14px; color: var(--dim); margin-bottom: 10px;
  }
  .hud b { color: var(--text); font-size: 16px; }
  .hud .spacer { flex: 1; }
  .hud button {
    background: var(--panel); color: var(--text);
    border: 1px solid var(--line); border-radius: 8px;
    padding: 6px 12px; font-size: 13px; cursor: pointer;
  }
  .hud button:hover { border-color: var(--accent); color: var(--accent); }
  .stage { position: relative; }
  canvas {
    display: block; width: 100%; height: auto;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    touch-action: none;
  }
  .overlay {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 8px;
    background: rgba(10, 12, 16, .82);
    border-radius: 12px;
    backdrop-filter: blur(2px);
  }
  .overlay.hidden { display: none; }
  .overlay h2 { margin: 0; font-size: 22px; }
  .overlay p { margin: 0; color: var(--dim); font-size: 14px; }
  .overlay button {
    margin-top: 8px; padding: 8px 20px;
    background: var(--accent); color: #07120a;
    border: 0; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer;
  }
  .pad { margin-top: 16px; text-align: center; }
  .pad .row { display: flex; justify-content: center; gap: 12px; }
  .pad button {
    width: 64px; height: 48px; margin: 4px;
    background: var(--panel); color: var(--text);
    border: 1px solid var(--line); border-radius: 10px;
    font-size: 18px; cursor: pointer;
  }
  .pad button:active { background: var(--line); }
  .tip { text-align: center; color: var(--dim); font-size: 12px; margin-top: 12px; }
  @media (min-width: 720px) { .pad { display: none; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="hud">
    <span>得分 <b id="score">0</b></span>
    <span>最高 <b id="best">0</b></span>
    <span class="spacer"></span>
    <button id="btn-pause" type="button">暂停</button>
    <button id="btn-restart" type="button">重开</button>
  </div>

  <div class="stage">
    <canvas id="game" width="400" height="400"></canvas>
    <div class="overlay hidden" id="overlay">
      <h2 id="ov-title">游戏结束</h2>
      <p id="ov-text">得分 0</p>
      <button id="ov-btn" type="button">再来一局</button>
    </div>
  </div>

  <div class="pad">
    <div class="row"><button type="button" data-dir="up">▲</button></div>
    <div class="row">
      <button type="button" data-dir="left">◀</button>
      <button type="button" data-dir="down">▼</button>
      <button type="button" data-dir="right">▶</button>
    </div>
  </div>

  <p class="tip">方向键 / WASD 控制 · 空格暂停 · R 重开</p>
</div>

<script>
(function () {
  'use strict';

  var COLS = 20, ROWS = 20, CELL = 20;
  var BASE_SPEED = 150, MIN_SPEED = 70, SPEED_STEP = 6, STEP_EVERY = 5;

  var canvas = document.getElementById('game');
  var ctx = canvas.getContext('2d');
  var scoreEl = document.getElementById('score');
  var bestEl = document.getElementById('best');
  var overlay = document.getElementById('overlay');
  var ovTitle = document.getElementById('ov-title');
  var ovText = document.getElementById('ov-text');

  // 高清屏适配
  var dpr = window.devicePixelRatio || 1;
  canvas.width = COLS * CELL * dpr;
  canvas.height = ROWS * CELL * dpr;
  canvas.style.width = '100%';
  canvas.style.height = 'auto';
  ctx.scale(dpr, dpr);

  var snake, dir, nextDir, food, score, speed, timer, paused, over;

  function bestScore() {
    try {
      var v = parseInt(localStorage.getItem('snake_best') || '0', 10);
      return isNaN(v) ? 0 : v;
    } catch (e) { return 0; }
  }

  function setBest(v) {
    try { localStorage.setItem('snake_best', String(v)); } catch (e) {}
    bestEl.textContent = v;
  }

  function reset() {
    snake = [{ x: 9, y: 10 }, { x: 8, y: 10 }, { x: 7, y: 10 }];
    dir = { x: 1, y: 0 };
    nextDir = { x: 1, y: 0 };
    score = 0;
    speed = BASE_SPEED;
    paused = false;
    over = false;
    scoreEl.textContent = '0';
    bestEl.textContent = bestScore();
    placeFood();
    hideOverlay();
    updatePauseBtn();
    restartLoop();
    draw();
  }

  function placeFood() {
    var free = [];
    for (var y = 0; y < ROWS; y++) {
      for (var x = 0; x < COLS; x++) {
        var occupied = snake.some(function (s) { return s.x === x && s.y === y; });
        if (!occupied) free.push({ x: x, y: y });
      }
    }
    food = free[Math.floor(Math.random() * free.length)] || { x: 0, y: 0 };
  }

  function restartLoop() {
    if (timer) clearInterval(timer);
    timer = setInterval(tick, speed);
  }

  function tick() {
    if (paused || over) return;

    // 防止 180° 掉头（x、y 同时相反才算掉头）
    if (!(nextDir.x === -dir.x && nextDir.y === -dir.y)) {
      dir = nextDir;
    }

    var head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

    if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) {
      return gameOver('撞墙了');
    }
    for (var i = 0; i < snake.length; i++) {
      if (snake[i].x === head.x && snake[i].y === head.y) {
        return gameOver('咬到自己了');
      }
    }

    snake.unshift(head);

    if (head.x === food.x && head.y === food.y) {
      score += 10;
      scoreEl.textContent = score;
      if (score > bestScore()) setBest(score);
      if (score % (STEP_EVERY * 10) === 0) {
        speed = Math.max(MIN_SPEED, speed - SPEED_STEP);
        restartLoop();
      }
      placeFood();
    } else {
      snake.pop();
    }

    draw();
  }

  function gameOver(reason) {
    over = true;
    clearInterval(timer);
    ovTitle.textContent = reason;
    ovText.textContent = '得分 ' + score + ' · 最高 ' + bestScore();
    overlay.classList.remove('hidden');
  }

  function hideOverlay() { overlay.classList.add('hidden'); }

  function draw() {
    ctx.clearRect(0, 0, COLS * CELL, ROWS * CELL);

    // 网格
    ctx.strokeStyle = 'rgba(255,255,255,.04)';
    ctx.lineWidth = 1;
    for (var i = 1; i < COLS; i++) {
      ctx.beginPath();
      ctx.moveTo(i * CELL, 0);
      ctx.lineTo(i * CELL, ROWS * CELL);
      ctx.stroke();
    }
    for (var j = 1; j < ROWS; j++) {
      ctx.beginPath();
      ctx.moveTo(0, j * CELL);
      ctx.lineTo(COLS * CELL, j * CELL);
      ctx.stroke();
    }

    // 食物
    ctx.fillStyle = '#ef4444';
    ctx.beginPath();
    ctx.arc(food.x * CELL + CELL / 2, food.y * CELL + CELL / 2, CELL / 2 - 3, 0, Math.PI * 2);
    ctx.fill();

    // 蛇
    for (var k = snake.length - 1; k >= 0; k--) {
      var seg = snake[k];
      var pad = k === 0 ? 1 : 2;
      ctx.fillStyle = k === 0 ? '#4ade80' : 'rgba(74,222,128,' + (0.85 - k * 0.03) + ')';
      roundRect(seg.x * CELL + pad, seg.y * CELL + pad, CELL - pad * 2, CELL - pad * 2, 5);
      ctx.fill();
    }

    // 眼睛
    var h = snake[0];
    ctx.fillStyle = '#0f1115';
    var ex = h.x * CELL + CELL / 2 + dir.x * 3;
    var ey = h.y * CELL + CELL / 2 + dir.y * 3;
    var dx = dir.x !== 0 ? 0 : 4;
    var dy = dir.y !== 0 ? 0 : 4;
    ctx.beginPath(); ctx.arc(ex - dx, ey - dy, 1.8, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(ex + dx, ey + dy, 1.8, 0, Math.PI * 2); ctx.fill();
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function updatePauseBtn() {
    document.getElementById('btn-pause').textContent = paused ? '继续' : '暂停';
  }

  function togglePause() {
    if (over) return;
    paused = !paused;
    updatePauseBtn();
  }

  function setDir(x, y) {
    if (over || paused) return;
    if (x === -dir.x && y === -dir.y) return;
    nextDir = { x: x, y: y };
  }

  // 键盘
  var KEYMAP = {
    ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0],
    w: [0, -1], s: [0, 1], a: [-1, 0], d: [1, 0],
    W: [0, -1], S: [0, 1], A: [-1, 0], D: [1, 0]
  };

  document.addEventListener('keydown', function (e) {
    if (e.key === ' ' || e.key === 'Spacebar') {
      e.preventDefault();
      togglePause();
      return;
    }
    if (e.key === 'r' || e.key === 'R') {
      reset();
      return;
    }
    var m = KEYMAP[e.key];
    if (m) {
      e.preventDefault();
      setDir(m[0], m[1]);
    }
  });

  // 手机方向键
  document.querySelectorAll('.pad button').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var d = btn.getAttribute('data-dir');
      if (d === 'up') setDir(0, -1);
      if (d === 'down') setDir(0, 1);
      if (d === 'left') setDir(-1, 0);
      if (d === 'right') setDir(1, 0);
    });
  });

  // 滑动手势
  var touchStart = null;
  canvas.addEventListener('touchstart', function (e) {
    var t = e.changedTouches[0];
    touchStart = { x: t.clientX, y: t.clientY };
  }, { passive: true });

  canvas.addEventListener('touchend', function (e) {
    if (!touchStart) return;
    var t = e.changedTouches[0];
    var dx = t.clientX - touchStart.x;
    var dy = t.clientY - touchStart.y;
    if (Math.abs(dx) < 24 && Math.abs(dy) < 24) { togglePause(); return; }
    if (Math.abs(dx) > Math.abs(dy)) setDir(dx > 0 ? 1 : -1, 0);
    else setDir(0, dy > 0 ? 1 : -1);
    touchStart = null;
  }, { passive: true });

  document.getElementById('btn-pause').addEventListener('click', togglePause);
  document.getElementById('btn-restart').addEventListener('click', reset);
  document.getElementById('ov-btn').addEventListener('click', reset);

  reset();
})();
</script>
</body>
</html>
